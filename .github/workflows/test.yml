name: Test

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      mypy-argument:
        required: true
        type: string
      python-versions:
        description: JSON list of the Python versions to test with
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the tests if a pull request only changes documentation. The jobs are skipped instead of the whole
  # workflow (paths-ignore), because a required check that never reports blocks the PR, see the 'tests' job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Only pull requests can skip the tests (not pushes or manual runs)
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh pr diff "$PR" --name-only --repo "$REPO")
          echo "Changed files:"
          echo "$files"
          code=false
          # Fail safe: run the tests if the changed files cannot be determined
          [ -z "$files" ] && code=true
          while IFS= read -r file; do
            case "$file" in
              *.md|LICENSE|.github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v7
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-suffix: py${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --group test
    - name: Run tests
      run: uv run pytest --junitxml=tests.xml
    - name: Test Report
      uses: mikepenz/action-junit-report@v6
      if: success() || failure()
      with:
        check_name: Test Results (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        report_paths: tests.xml

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        python-version: [ "3.12" ]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: coverage
      - name: Install dependencies
        run: uv sync --group test
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --junitxml=tests.xml
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 95'
      - name: Output Code Coverage (Python version ${{ matrix.python-version }})
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        python-version: [ "3.12" ]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: typecheck
      - name: Install dependencies
        run: uv sync --group test
      - name: Type checker
        run: uv run mypy ${{ inputs.mypy-argument }}

  # The check to require in the rulesets: succeeds if all jobs passed or were skipped because only
  # documentation changed. Skipped matrix jobs don't report their individual checks (e.g. 'test (3.12, ...)').
  tests:
    if: always()
    needs: [changes, test, coverage, typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: All tests passed or were skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          [ "$FAILED" = "false" ]
